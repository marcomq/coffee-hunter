<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a2a1d"/>
      <stop offset="1" stop-color="#17110f"/>
    </linearGradient>
    <linearGradient id="bean" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#b3762e"/>
      <stop offset="0.55" stop-color="#7d4718"/>
      <stop offset="1" stop-color="#4c2a0e"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="52" fill="url(#soil)"/>

  <!-- coffee bean -->
  <g transform="translate(128 128) rotate(-24)">
    <ellipse cx="7" cy="10" rx="73" ry="53" fill="#000" opacity="0.4"/>
    <ellipse cx="0" cy="0" rx="73" ry="53" fill="url(#bean)"/>
    <!-- the crease is what makes it read as a coffee bean rather than an egg -->
    <path d="M-67 7 C-34 -27 34 27 67 -7" fill="none" stroke="#2e1608"
          stroke-width="15" stroke-linecap="round"/>
    <path d="M-67 7 C-34 -27 34 27 67 -7" fill="none" stroke="#120903"
          stroke-width="6" stroke-linecap="round" opacity="0.75"/>
    <path d="M-55 -29 C-31 -45 7 -41 35 -27" fill="none" stroke="#ffd27a" stroke-width="7"
          stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
