name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  desktop-web:
    name: Desktop + Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          templates: "true"

      - name: Export
        run: |
          mkdir -p build/linux build/windows build/macos build/web dist
          godot --headless --path . --export-release "Linux"           build/linux/CoffeeHunter.x86_64
          godot --headless --path . --export-release "Windows Desktop" build/windows/CoffeeHunter.exe
          godot --headless --path . --export-release "macOS"           build/macos/CoffeeHunter.zip
          godot --headless --path . --export-release "Web"             build/web/index.html

      - name: Package
        run: |
          (cd build/linux   && zip -qr ../../dist/CoffeeHunter-linux-x86_64.zip .)
          (cd build/windows && zip -qr ../../dist/CoffeeHunter-windows-x86_64.zip .)
          cp build/macos/CoffeeHunter.zip dist/CoffeeHunter-macos.zip
          (cd build/web     && zip -qr ../../dist/CoffeeHunter-web.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-web
          path: dist/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Without a release keystore the APK would be unsignable, so the rest of
      # this job is skipped rather than failing the whole release.
      - name: Check for signing keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
          else
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"
            echo "::notice::ANDROID_KEYSTORE_BASE64 is not set - skipping the Android build."
          fi

      - uses: actions/setup-java@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        if: env.HAS_KEYSTORE == 'true'
        with:
          packages: "platform-tools build-tools;34.0.0 platforms;android-34"

      - uses: ./.github/actions/setup-godot
        if: env.HAS_KEYSTORE == 'true'
        with:
          version: ${{ env.GODOT_VERSION }}
          templates: "true"

      # Godot finds the SDK and JDK through editor settings, not env vars.
      - name: Point Godot at the Android SDK
        if: env.HAS_KEYSTORE == 'true'
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<TRES
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          TRES

      - name: Export signed APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p build/android dist
          printf '%s' "$KEYSTORE_B64" | base64 -d > /tmp/release.keystore
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH=/tmp/release.keystore
          godot --headless --path . --export-release "Android" build/android/CoffeeHunter.apk
          cp build/android/CoffeeHunter.apk dist/CoffeeHunter-android-arm64.apk

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: android
          path: dist/

  release:
    name: Publish GitHub Release
    needs: [desktop-web, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            Desktop builds are unsigned: Windows shows a SmartScreen warning,
            and macOS needs Right-click -> Open (or System Settings -> Privacy
            & Security -> Open Anyway) on first launch.

  pages:
    name: Deploy web build
    needs: desktop-web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
